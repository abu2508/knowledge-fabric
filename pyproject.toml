[project]
name = "knowledge-fabric"
version = "0.1.0"
description = "A small, dependency-light RAG starter kit"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
qa = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_fabric*"]

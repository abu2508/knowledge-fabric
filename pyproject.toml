[project]
name = "knowledge-fabric"
version = "0.1.0"
description = "GraphRAG for compliance/policy-code drift detection, plus a small RAG starter kit"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
qa = ["anthropic>=0.40"]
graphrag = [
    "anthropic>=0.40",
    "tree-sitter>=0.23",
    "tree-sitter-ruby>=0.23",
    "boto3>=1.34",
    "gremlinpython>=3.7",
]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_fabric*"]
